<div class="main-layout">
  <module-title-panel icon="query_stats" title="{{loc('title') + ' '+qar.tradingSystem?.name}}" (onClose)="onClose()"></module-title-panel>

  <!-- ============================================================================================================= -->

  <div class="header-layout">
    <period-selector [(period)]="period"  (periodChange)="onPeriodChange($event)"></period-selector>
    <select-required [label]="loc('timeframe')" [(key)]="timeframeType"  [map] ="timeframes" (keyChange)="onTimeframeChange($event)"></select-required>
    <select-required [label]="loc('atrLength')" [(key)]="atrLength"      [map] ="atrLengths" (keyChange)="onAtrLengthChange($event)"></select-required>

    <span style="flex:1 0 auto"></span>

    <mat-button-toggle-group [hideSingleSelectionIndicator]="true" [formControl]="selTab">
      <mat-button-toggle value="market"      (change)="onTabSet()">{{ loc("tab.market") }}</mat-button-toggle>
    </mat-button-toggle-group>

    <div>
      <button mat-icon-button (click)="onReloadClick()">
        <span class="material-symbols-outlined">refresh</span>
      </button>
    </div>
  </div>

  <!-- - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -->

  @if (goodData) {
    @if (selTab.value=='market') {
      <quality-market-panel class="panel-layout" [qar]="qar"></quality-market-panel>
    }
  }

  @if (!goodData) {
    <div class="no-data">
      <mat-icon class="material-symbols-outlined">info</mat-icon>
      <span>{{loc("noData")}}</span>
    </div>
  }

  <!-- ============================================================================================================= -->

</div>
