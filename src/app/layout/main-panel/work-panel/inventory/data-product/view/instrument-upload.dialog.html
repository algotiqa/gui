<h2 mat-dialog-title>{{loc("title")}}</h2>

<mat-dialog-content class="mat-typography">
  <div class="main-layout">
    <input-text-required #iuSymbolCtrl   [label]="mod('symbol')"       [(value)]="spec.symbol"         [len]="16" [disabled]="buttonsDisabled"></input-text-required>
    <input-text-required #iuNameCtrl     [label]="mod('name')"         [(value)]="spec.name"           [len]="64" [disabled]="buttonsDisabled"></input-text-required>
    <select-required     #fileTimezoneCtrl [label]="loc('fileTimezone')" [(key)]="spec.fileTimezone" [map]="fileTimezones"></select-required>
    <select-required     #parserCtrl       [label]="loc('parser')"       [(key)]="spec.parser"       [map]="parsers"></select-required>
  </div>
  <file-uploader #fileUpload [acceptedTypes]="'csv'" (onFileChange)="onFileChange($event)" [disabled]="buttonsDisabled"></file-uploader>
  <br>
  <mat-progress-bar mode="determinate" [value]="progress"></mat-progress-bar>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <flat-button [disabled]="!uploadEnabled()" (click)="onUpload()" [label]="button('upload')"></flat-button>
  <flat-button [disabled]="buttonsDisabled" mat-dialog-close [label]="button('close')"></flat-button>
</mat-dialog-actions>
