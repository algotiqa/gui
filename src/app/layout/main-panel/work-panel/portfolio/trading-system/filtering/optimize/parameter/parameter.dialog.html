<h2 mat-dialog-title>{{loc("params.title")}}</h2>
<mat-dialog-content class="dialog-style">
  <mat-tab-group>
    <mat-tab label="{{loc('params.activations')}}">
      <br/>
      <param-panel [config]="options.filterConfig.activation"></param-panel>
    </mat-tab>

    <mat-tab label="{{loc('params.deactivations')}}">
      <br/>
      <param-panel [config]="options.filterConfig.deactivation"></param-panel>
    </mat-tab>

    <mat-tab label="{{loc('params.algorithm')}}">
      <br/>
      <select-required [(key)]="options.fieldToOptimize" [label]="loc('params.optimizeFor')" keyField="id" valueField="name" [list]="labelMap('params.fieldOptions')" class="field-to-optimize"></select-required>
      <select-required [(key)]="options.algorithm.type"  [label]="loc('params.algorithm')"   keyField="id" valueField="name" [list]="labelMap('params.algorOptions')" class="field-to-optimize"></select-required>

    </mat-tab>
  </mat-tab-group>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onReset()">{{button("reset")}}</button>
  <button mat-button (click)="onRun()">{{button("run")}}</button>
  <button mat-button mat-dialog-close>{{button("cancel")}}</button>
</mat-dialog-actions>
