<list-panel [title]="loc('title')">
  <list-buttons>
    <create-button     (click)="onCreateClick()"     [disabled]="disCreate"></create-button>
    <view-button       (click)="onViewClick()"       [disabled]="disView"  ></view-button>
    <edit-button       (click)="onEditClick()"       [disabled]="disEdit"  ></edit-button>
    <playground-button (click)="onPlaygroundClick()" [disabled]="disPlay"  ></playground-button>
    <delete-button     (click)="onDeleteClick()"     [disabled]="disDelete"></delete-button>
  </list-buttons>

  <!-- - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -->

  <list-content>
    <flex-table #table class="form-layout"
                [columns]     = "columns"
                [dataProvider]= "service"
                (onRowsSelected)="onRowSelected($event)"
    ></flex-table>
  </list-content>
</list-panel>
