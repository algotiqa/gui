<mat-form-field class="main-layout">
  <mat-label>{{label}}</mat-label>
  <input matInput [type]="type" [formControl]="formControl" [errorStateMatcher]="matcher">
  @if (formControl.value && !disabled) {
    <button matSuffix mat-icon-button (click)="onClear()" [disabled]="disabled">
      <mat-icon>close</mat-icon>
    </button>
  }
  @if (formControl.hasError('maxlength')) {
    <mat-error>
      {{loc("input.tooLong")}}
    </mat-error>
  }
</mat-form-field>
