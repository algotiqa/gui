<mat-form-field class="main-layout">
  <mat-label>{{label}}</mat-label>
  <mat-select [formControl]="formControl" [disabled]="disabled">
    @for (item of list; track item) {
      <mat-option [value]="item[keyField]">{{item[valueField]}}</mat-option>
    }
    @for (key  of mapKeys(); track key ) {
      <mat-option [value]="key">{{mapValue(key)}}</mat-option>
    }
  </mat-select>
</mat-form-field>
