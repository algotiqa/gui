<div class="asm-menu" [ngClass]="'asm-menu--mode-' + mode" [@.disabled]="disableAnimations">
  <ng-content></ng-content>
  <ul class="asm-menu__node">
    @for (item of menu; track trackByItem($index, item)) {
      @if (roleService.showItem$(item.roles) | async) {
        <li asm-menu-item
          class="asm-menu-item asm-menu-item--root"
          [menuItem]="item"
          [level]="0"
        ></li>
      }
    }
  </ul>
</div>
