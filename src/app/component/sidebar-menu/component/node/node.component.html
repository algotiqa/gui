<ul [@openClose]="isOpen">
  @if (level === 0) {
    <li class="asm-menu-item">
      <span class="asm-menu-node__label">{{ menuItem.label }}</span>
    </li>
  }
  @for (childItem of menuItem.children; track trackByItem($index, childItem)) {
    @if (roleService.showItem$(childItem.roles) | async) {
      <li
        asm-menu-item
        class="asm-menu-item"
        [menuItem]="childItem"
        [level]="level + 1"
        [disable]="disable"
      ></li>
    }
  }
</ul>
